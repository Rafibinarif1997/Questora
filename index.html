<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PASS — Missions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      height: 70px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .connect-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 90px 20px;
    }

    .hero {
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    .badge {
      display: inline-block;
      border: 1px solid #333;
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(45px, 8vw, 90px);
      line-height: .95;
      margin-bottom: 25px;
    }

    .hero p {
      color: #999;
      font-size: 18px;
      line-height: 1.6;
    }

    .cta {
      margin-top: 35px;
    }

    .primary-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 15px 25px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 80px;
    }

    .stat {
      border: 1px solid #222;
      padding: 25px;
      border-radius: 12px;
      background: #0d0d0d;
    }

    .stat span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat strong {
      font-size: 25px;
    }

    footer {
      text-align: center;
      color: #555;
      padding: 40px 20px;
      border-top: 1px solid #181818;
    }

    @media (max-width: 650px) {
      header {
        padding: 0 20px;
      }

      main {
        padding-top: 70px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">PASS</div>

    <button class="connect-btn" onclick="connectWallet()">
      CONNECT
    </button>
  </header>

  <main>

    <section class="hero">

      <div class="badge">
        MISSION • POINTS • WL
      </div>

      <h1>
        EARN YOUR<br>
        PASS.
      </h1>

      <p>
        Complete missions, earn points, keep your Pass,
        and unlock whitelist access.
      </p>

      <div class="cta">
        <button class="primary-btn" onclick="connectWallet()">
          CONNECT WALLET
        </button>
      </div>

    </section>

    <section class="stats">

      <div class="stat">
        <span>PASS SUPPLY</span>
        <strong>1,000</strong>
      </div>

      <div class="stat">
        <span>MISSIONS</span>
        <strong>00</strong>
      </div>

      <div class="stat">
        <span>WL TARGET</span>
        <strong>5,000</strong>
      </div>

    </section>

  </main>

  <footer>
    PASS © 2026
  </footer>

  <script>
    function connectWallet() {
      alert("Wallet connection will be added in the next step.");
    }
  </script>

</body>
</html>
