<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="RHOOD Forge — a native token launch terminal for Robinhood Chain." />
    <title>RHOOD Forge — Launch Without Permission</title>
  </head>
  <body>
    <script>
      // Restore a deep React Router URL after GitHub Pages returns 404.html.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
