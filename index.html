
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RH Trading Bot — Demo</title>
  <style>
    body {
      background: #10131b;
      color: #e9eef7;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    main {
      max-width: 480px;
      margin: 40px auto;
      padding: 24px;
      border: 1px solid #30394a;
      border-radius: 16px;
      background: #191f2c;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #77e0b5;
      color: #10131b;
      font-weight: bold;
    }
    #status { margin-top: 20px; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h2>RH Trading Bot</h2>
    <p>Robinhood Chain Testnet</p>
    <button id="check">Check Connection</button>
    <div id="status">Ready to test.</div>
  </main>

  <script>
    const RPC =
      "https://rpc.testnet.chain.robinhood.com";

    document.getElementById("check").onclick =
      async function () {
        const status = document.getElementById("status");
        status.textContent = "Connecting...";

        try {
          const response = await fetch(RPC, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              jsonrpc: "2.0",
              method: "eth_chainId",
              params: [],
              id: 1
            })
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const data = await response.json();

          if (data.error) {
            throw new Error(data.error.message);
          }

          const chainId = parseInt(data.result, 16);

          if (chainId !== 46630) {
            throw new Error(
              "Unexpected Chain ID: " + chainId
            );
          }

          status.innerHTML =
            "Connection successful!<br>" +
            "Network: Robinhood Chain Testnet<br>" +
            "Chain ID: " + chainId + "<br>" +
            "Mode: Demo only — no real trades";
        } catch (error) {
          status.textContent =
            "Connection failed: " + error.message +
            ". RPC or browser access may be blocked.";
        }
      };
  </script>
</body>
</html>
