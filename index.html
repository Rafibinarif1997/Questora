<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PASS — Missions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 70px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    .connect-btn,
    .primary-btn {
      background: white;
      color: black;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 90px 20px;
    }

    .hero {
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    .badge {
      display: inline-block;
      border: 1px solid #333;
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(45px, 8vw, 90px);
      line-height: .95;
      margin-bottom: 25px;
    }

    .hero p {
      color: #999;
      font-size: 18px;
      line-height: 1.6;
    }

    .cta {
      margin-top: 35px;
    }

    .wallet-box {
      display: none;
      margin: 35px auto 0;
      max-width: 500px;
      border: 1px solid #222;
      background: #0d0d0d;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
    }

    .wallet-box.active {
      display: block;
    }

    .wallet-label {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .wallet-address {
      word-break: break-all;
      font-size: 14px;
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 80px;
    }

    .stat {
      border: 1px solid #222;
      padding: 25px;
      border-radius: 12px;
      background: #0d0d0d;
    }

    .stat span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat strong {
      font-size: 25px;
    }

    footer {
      text-align: center;
      color: #555;
      padding: 40px 20px;
      border-top: 1px solid #181818;
    }

    @media (max-width: 650px) {
      header {
        padding: 0 20px;
      }

      main {
        padding-top: 70px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    PASS
  </div>

  <button
    id="connectButton"
    class="connect-btn"
    onclick="connectWallet()">
    CONNECT
  </button>

</header>


<main>

  <section class="hero">

    <div class="badge">
      MISSION • POINTS • WL
    </div>

    <h1>
      EARN YOUR<br>
      PASS.
    </h1>

    <p>
      Complete missions, earn points, keep your Pass,
      and unlock whitelist access.
    </p>

    <div class="cta">

      <button
        class="primary-btn"
        onclick="connectWallet()">
        CONNECT WALLET
      </button>

    </div>


    <div
      id="walletBox"
      class="wallet-box">

      <div class="wallet-label">
        CONNECTED WALLET
      </div>

      <div
        id="walletAddress"
        class="wallet-address">
      </div>

    </div>

  </section>


  <section class="stats">

    <div class="stat">
      <span>PASS SUPPLY</span>
      <strong>1,000</strong>
    </div>

    <div class="stat">
      <span>MISSIONS</span>
      <strong>00</strong>
    </div>

    <div class="stat">
      <span>WL TARGET</span>
      <strong>5,000</strong>
    </div>

  </section>

</main>


<footer>
  PASS © 2026
</footer>


<!-- Ethers -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<script>

async function connectWallet() {

  if (!window.ethereum) {

    alert(
      "No Web3 wallet detected.\n\n" +
      "Open this website inside your wallet browser."
    );

    return;
  }


  try {

    const accounts =
      await window.ethereum.request({
        method: "eth_requestAccounts"
      });


    const address = accounts[0];


    document.getElementById(
      "walletAddress"
    ).textContent = address;


    document.getElementById(
      "walletBox"
    ).classList.add("active");


    document.getElementById(
      "connectButton"
    ).textContent =
      address.slice(0, 6) +
      "..." +
      address.slice(-4);


    console.log(
      "Connected wallet:",
      address
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "Wallet connection failed."
    );

  }

}

</script>

</body>
</html>
